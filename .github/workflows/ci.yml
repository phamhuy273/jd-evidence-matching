name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend (Spring Boot 3.x) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x apps/backend-service/mvnw

      - name: Run Spring Boot Tests
        run: |
          cd apps/backend-service
          ./mvnw clean test --no-transfer-progress

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: apps/backend-service/target/surefire-reports/
          if-no-files-found: ignore

  ai-engine-test:
    name: AI Engine (FastAPI & Tree-sitter) CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-engine/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-engine/requirements.txt

      - name: Run Pytest for Parser & Endpoints
        run: |
          cd apps/ai-engine
          python -m pytest -v

  docker-build-check:
    name: Docker & Compose Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend-service
          push: false
          tags: jd-matching-backend:ci-check

      - name: Test Build AI Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-engine
          push: false
          tags: jd-matching-ai:ci-check
