version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: jd_matching_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jd_matching_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_db_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: jd_matching_fastapi
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password_db_secret}@postgres-vector:5432/${POSTGRES_DB:-jd_matching_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_PERSONAL_TOKEN=${GITHUB_PERSONAL_TOKEN}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
    depends_on:
      - postgres-vector
    networks:
      - app-network

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: jd_matching_springboot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/${POSTGRES_DB:-jd_matching_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password_db_secret}
      - AI_ENGINE_URL=http://ai-engine:8001
    depends_on:
      - postgres-vector
      - ai-engine
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
