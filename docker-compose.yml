version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: jd_matching_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jd_matching_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_db_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/database/init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  embeddings:
    image: ollama/ollama:latest
    volumes:
      - modeldata:/root/.ollama
    networks:
      - app-network

  load-embedding-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://embeddings:11434
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; exec ollama pull bge-m3"]
    depends_on:
      - embeddings
    networks:
      - app-network

  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    env_file:
      - path: ./apps/ai-engine/.env
        required: false
      - path: ./.env
        required: false
    container_name: jd_matching_fastapi
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password_db_secret}@postgres-vector:5432/${POSTGRES_DB:-jd_matching_db}
      - OLLAMA_URL=http://embeddings:11434
    depends_on:
      postgres-vector:
        condition: service_started
      load-embedding-model:
        condition: service_completed_successfully
    networks:
      - app-network

  backend-service:
    build:
      context: ./apps/backend-service
      dockerfile: Dockerfile
    container_name: jd_matching_springboot
    restart: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vector:5432/${POSTGRES_DB:-jd_matching_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password_db_secret}
      - AI_ENGINE_URL=http://ai-engine:8001
    depends_on:
      - postgres-vector
      - ai-engine
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  modeldata:
    driver: local
